name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formula syntax
        run: |
          for formula in Formula/*.rb; do
            echo "Checking $formula"
            ruby -c "$formula"
          done
